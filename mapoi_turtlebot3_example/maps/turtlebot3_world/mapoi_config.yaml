# シナリオ: 機能カタログ demo (#230)。waypoint / landmark / pause を 1 route ずつ確認できる
# tutorial 系 + 全機能を踏む tour_full。自前 robot 流用を意識し機能ベースの抽象名で命名。
#
# demo subscriber (audio_guide_node / camera_node) は本 launch から分離 (#238)。立ち上げない
# 場合は ros2 topic echo /mapoi/events で確認、立ち上げると audio 発話 / camera 撮影 mock が走る。
#
# 本 demo は waypoint_arrival_mode=mapoi 既定 (#243)。POI 座標調整時の制約:
# - waypoint tolerance.xy は Nav2 controller の xy_goal_tolerance (0.25) 以上に取る。mapoi
#   モードの到達は統一仕様 (#265) で (tolerance.xy ∧ tolerance.yaw) ∨ Nav2 SUCCEEDED なので
#   進行自体は保証されるが、ENTER / pause の EVENT_PAUSED は robot が tolerance.xy 内に入って
#   初めて発火するため、Nav2 が止まる ~0.25 より小さいと取りこぼす。本 demo は安全側に
#   waypoint 一律 0.3。さらに小さくするには burger.yaml の goal_checker.xy_goal_tolerance も
#   下げて robot を tight 半径まで寄せる (詳細は mapoi_server/README.md「waypoint 到達モード」節)。
# - landmark tolerance.xy は ENTER トリガ半径で waypoint 進行とは独立。経路 (waypoint 直線) が
#   radius に掛かる程度の広さを保てばよく、audio_landmark は 0.35 のまま (狭めない)。
# - tolerance.yaw >= 0.001 (msg spec #138)。統一仕様 (#265) で yaw は中間 waypoint / 最終 goal /
#   単発 Go すべての到達判定に効く。到達判定の角度差は [0, π] (最大 π ≈ 180°)。yaw を問わない
#   純通過点は π (= 180°、yaml では 3.1416) にする (fly-through、basic_waypoint)。WebUI は
#   yaw 不問を塗りつぶし円 (disc) で描画 (#267)。向きが要る POI は小値 (goal は 0.1、pause は
#   撮影向きを緩く問う 1.5708 = 90°)。値は区切りの良い度数の rad 等価に揃え、WebUI の度数表示
#   (#267) で 180/90/120/45° と綺麗に round-trip する (start=2.0944=120°, audio_landmark=0.7854=45°)。
# - tag 排他: landmark × pause / landmark × waypoint は #143 validation で reject。
custom_tags:
- {name: audio_info, description: Audio guide trigger (POI 進入で音声再生 mock)}
- {name: capture_trigger, description: Camera capture trigger (pause POI で停止中に撮影 mock)}
route:
- name: tutorial_01_basic
  waypoints: [start, basic_waypoint, goal]
- landmarks: [audio_landmark]
  name: tutorial_02_landmark
  waypoints: [start, basic_waypoint, goal]
- name: tutorial_03_pause
  waypoints: [start, pause_waypoint, goal]
  landmarks: []
- landmarks: [audio_landmark]
  name: tour_full
  waypoints: [start, basic_waypoint, pause_waypoint, goal]
map:
- {node_name: /map_server, map_file: turtlebot3_world.yaml}
gazebo:
  world_model: {uri: 'model://turtlebot3_world', name: turtlebot3_world}
# description は user-facing (WebUI POI カード / demo subscriber の log に verbatim 表示) なので
# 「その地点が何か」の短句のみ書き、route 参照・検証観点は各エントリ上のコメントに置く。
poi:
# 全 route 起点。POI list 先頭 = default initial pose、Gazebo spawn 位置と一致。
- description: Route start point
  name: start
  pose: {x: -2.0, y: -0.5, yaw: 0.0}
  tags: [waypoint]
  tolerance: {xy: 0.3, yaw: 2.0944}
# tutorial_01 / 02 / tour_full の南側中継点 (pure waypoint、yaw 不問で fly-through)。
- description: Pass-through waypoint
  name: basic_waypoint
  pose: {x: -0.6, y: -0.89, yaw: 0.06}
  tags: [waypoint]
  tolerance: {xy: 0.3, yaw: 3.1416}
# tutorial_03 / tour_full の pause POI。停止中に camera_node の撮影 mock が発火 (capture_trigger)。
- description: Camera capture stop
  name: pause_waypoint
  pose: {x: 0.01, y: -0.27, yaw: -0.08}
  tags: [waypoint, pause, capture_trigger]
  tolerance: {xy: 0.3, yaw: 1.5708}
# tutorial_01 / 02 / tour_full の終点 (北、yaw 厳密)。
- description: Final goal (exact heading)
  name: goal
  pose: {x: 0.66, y: -0.65, yaw: 0.01}
  tags: [waypoint]
  tolerance: {xy: 0.3, yaw: 0.1}
# tutorial_02 / tour_full の route.landmarks 列挙対象。audio_info で audio_guide_node が発火。
- description: Audio guide spot
  name: audio_landmark
  pose: {x: -1.09, y: -0.5, yaw: -0.03}
  tags: [landmark, audio_info]
  tolerance: {xy: 0.35, yaw: 0.7854}
